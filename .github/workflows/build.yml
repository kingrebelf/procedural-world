name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and NSIS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis zip
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q tpl.tpz -d tpl && mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf tpl tpl.tpz godot.zip

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Run unit tests
        run: timeout 900 godot --headless --path . --script res://tests/run_tests.gd

      - name: Run end-to-end persistence test
        run: timeout 900 godot --headless --path . --script res://tests/integration_test.gd

      - name: Run dedicated server test
        run: timeout 900 godot --headless --path . --script res://tests/net_test.gd

      - name: Build games, installer and servers
        run: ./tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: procedural-world-builds
          path: |
            build/*.exe
            build/*.zip
            build/*.tar.gz

      # Every push to main publishes (or refreshes) the release for the version in
      # project.godot, so the newest installer is always on the Releases page.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(grep -oP 'config/version="\K[^"]+' project.godot)"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" build/*.exe build/*.zip build/*.tar.gz --clobber
          else
            gh release create "$VERSION" build/*.exe build/*.zip build/*.tar.gz --target "$GITHUB_SHA" \
              --title "Procedural World $VERSION" --prerelease \
              --notes "Early vertical slice. Windows: run the Setup.exe (or unzip the portable build). Linux: extract the tarball. Dedicated server (Linux, Windows, macOS): the ProceduralWorldServer packages, see docs/SERVER.md. See README for controls and the roadmap for what is next."
          fi
